<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90" role="img" aria-label="starflower - Bloom with Technology.">
  <defs>
    <path id="petal-f" d="M40,40 C35.2,34.4 32.8,20.8 40,10.4 C47.2,20.8 44.8,34.4 40,40Z"/>
  </defs>

  <!-- アイコン -->
  <use href="#petal-f" fill="#FF6B47"/>
  <use href="#petal-f" fill="#FF6B47" transform="rotate(60,40,40)"/>
  <use href="#petal-f" fill="#FF6B47" transform="rotate(120,40,40)"/>
  <use href="#petal-f" fill="#FF6B47" transform="rotate(180,40,40)"/>
  <use href="#petal-f" fill="#FF6B47" transform="rotate(240,40,40)"/>
  <use href="#petal-f" fill="#FF6B47" transform="rotate(300,40,40)"/>
  <circle cx="40" cy="40" r="6" fill="#2D2D2D"/>

  <!-- テキスト："star"（細字・ダーク）＋"flower"（太字・オレンジ） -->
  <text y="48" font-family="Raleway, Poppins, Inter, -apple-system, sans-serif" font-size="34" letter-spacing="-0.5">
    <tspan x="90" fill="#2D2D2D" font-weight="300">star</tspan><tspan fill="#FF6B47" font-weight="700">flower</tspan>
  </text>

  <!-- タグライン：Bloom with Technology. -->
  <text x="91" y="66" font-family="Raleway, Poppins, Inter, -apple-system, sans-serif" font-size="10.5" font-weight="300" fill="#AAAAAA" letter-spacing="0.12em">Bloom with Technology.</text>
</svg>
