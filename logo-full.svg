  <path d="M24,24 L22,13.5 L24,3 L26,13.5Z" fill="#FF6B47" transform="rotate(180,24,24)"/>
  <path d="M24,24 L22,13.5 L24,3 L26,13.5Z" fill="#FF6B47" transform="rotate(240,24,24)"/>
  <path d="M24,24 L22,13.5 L24,3 L26,13.5Z" fill="#FF6B47" transform="rotate(300,24,24)"/>
