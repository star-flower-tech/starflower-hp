<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80" role="img" aria-label="starflower - Bloom with Technology.">
  <defs>
    <!-- Sharp starburst petal: thin elongated diamond, base at center -->
    <path id="sf-petal" d="M40,40 L37,23 L40,7 L43,23 Z"/>
  </defs>

  <!-- 6 petals at 60° intervals — coral orange starburst -->
  <use href="#sf-petal" fill="#FF6B47"/>
  <use href="#sf-petal" fill="#FF6B47" transform="rotate(60,40,40)"/>
  <use href="#sf-petal" fill="#FF6B47" transform="rotate(120,40,40)"/>
  <use href="#sf-petal" fill="#FF6B47" transform="rotate(180,40,40)"/>
  <use href="#sf-petal" fill="#FF6B47" transform="rotate(240,40,40)"/>
  <use href="#sf-petal" fill="#FF6B47" transform="rotate(300,40,40)"/>

  <!-- Center: small dark circle -->
  <circle cx="40" cy="40" r="5" fill="#1A1A2E"/>

  <!-- Wordmark: ultra-light, wide tracking — system font for crisp rendering -->
  <text x="90" y="46" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="200" fill="#1A1A2E" letter-spacing="3.5">starflower</text>

  <!-- Tagline -->
  <text x="91" y="63" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="300" fill="#C0C0C0" letter-spacing="4">Bloom with Technology.</text>
</svg>
