<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80" role="img" aria-label="starflower">
  <!-- 白バージョン：ダーク・カラー背景用 -->
  <defs>
    <path id="petal-w" d="M40,40 C35.2,34.4 32.8,20.8 40,10.4 C47.2,20.8 44.8,34.4 40,40Z"/>
  </defs>

  <!-- アイコン（花びら：白 / 中心：オレンジ） -->
  <use href="#petal-w" fill="#FFFFFF"/>
  <use href="#petal-w" fill="#FFFFFF" transform="rotate(60,40,40)"/>
  <use href="#petal-w" fill="#FFFFFF" transform="rotate(120,40,40)"/>
  <use href="#petal-w" fill="#FFFFFF" transform="rotate(180,40,40)"/>
  <use href="#petal-w" fill="#FFFFFF" transform="rotate(240,40,40)"/>
  <use href="#petal-w" fill="#FFFFFF" transform="rotate(300,40,40)"/>
  <circle cx="40" cy="40" r="6.4" fill="#FF6B35"/>

  <!-- テキスト：白 -->
  <text y="52" font-family="Poppins, Inter, -apple-system, sans-serif" font-weight="600" font-size="32" letter-spacing="-0.5">
    <tspan x="90" fill="#FFFFFF">star</tspan><tspan fill="rgba(255,255,255,0.7)">flower</tspan>
  </text>
</svg>
